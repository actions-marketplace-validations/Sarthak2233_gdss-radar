  <rect x="325" y="285" width="450" height="115" rx="8" fill="url(#workerGrad)" stroke="#0284c7" stroke-width="1.5" />
  <text x="337" y="307" fill="#38bdf8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Worker Thread 2: Cluster 2 (services/billing.py)</text>
  <rect x="337" y="318" width="130" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="345" y="338" fill="#38bdf8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700">1. Lossless 3-Way Context</text>
  <text x="345" y="354" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">billing.py pristine AST</text>
  <text x="345" y="368" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Full caller trace</text>

  <line x1="467" y1="350" x2="495" y2="350" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

  <rect x="495" y="318" width="125" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="503" y="338" fill="#38bdf8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700">2. LLM Dispatch</text>
  <text x="503" y="354" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Concurrent with Worker 1</text>
  <text x="503" y="368" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">0 idle wait time</text>

  <line x1="620" y1="350" x2="648" y2="350" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

  <rect x="648" y="318" width="115" height="65" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="654" y="338" fill="#34d399" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700">3. Fast Local Check</text>
  <text x="654" y="354" fill="#a7f3d0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Diff verified clean</text>
  <text x="654" y="368" fill="#ecfdf5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">0 syntax regression</text>

  <!-- Worker 3 -->
  <rect x="325" y="415" width="450" height="115" rx="8" fill="url(#workerGrad)" stroke="#a855f7" stroke-width="1.5" />
