  <rect x="337" y="448" width="130" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="345" y="468" fill="#38bdf8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700">1. Lossless 3-Way Context</text>
  <text x="345" y="484" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">JSX / TSX lossless body</text>
  <text x="345" y="498" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Complete component state</text>

  <line x1="467" y1="480" x2="495" y2="480" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

  <rect x="495" y="448" width="125" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="503" y="468" fill="#38bdf8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700">2. LLM Dispatch</text>
  <text x="503" y="484" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Concurrent execution</text>
  <text x="503" y="498" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Fast response cycle</text>

  <line x1="620" y1="480" x2="648" y2="480" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

  <rect x="648" y="448" width="115" height="65" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="654" y="468" fill="#34d399" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700">3. Fast Local Check</text>
  <text x="654" y="484" fill="#a7f3d0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Syntax validated</text>
  <text x="654" y="498" fill="#ecfdf5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Ready for composite</text>

  <!-- Connectors from Stage 2 to Stage 3 -->
  <line x1="790" y1="220" x2="840" y2="280" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <line x1="790" y1="350" x2="840" y2="335" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <line x1="790" y1="480" x2="840" y2="390" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />

  <!-- ================= STAGE 3: COMPOSITE SANDBOX & AUDIT ================= -->
  <rect x="840" y="100" width="240" height="470" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" />
  <rect x="852" y="112" width="216" height="28" rx="6" fill="#065f46" />
  <text x="860" y="131" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">3 · COMPOSITE PROOF &amp; AUDIT</text>

  <rect x="852" y="155" width="216" height="100" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
  <text x="862" y="177" fill="#34d399" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Composite Worktree Sandbox</text>
  <text x="862" y="195" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Applies all verified patches</text>
  <text x="862" y="213" fill="#cbd5e1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Static Types (mypy, tsc, cargo)</text>
  <text x="862" y="231" fill="#cbd5e1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Targeted Unit Tests (pytest, jest)</text>
  <text x="862" y="247" fill="#6ee7b7" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Zero workspace mutation</text>

  <line x1="960" y1="255" x2="960" y2="295" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

