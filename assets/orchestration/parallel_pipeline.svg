  <text x="345" y="224" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Base + Branch A + Branch B</text>
  <text x="345" y="238" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Zero destructive slicing</text>

  <line x1="467" y1="220" x2="495" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

