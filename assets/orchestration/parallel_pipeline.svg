  <text x="862" y="335" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Persists to .gdss/suggestions/</text>
  <text x="862" y="353" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Immutable sug_&lt;hash&gt; ID</text>
  <text x="862" y="369" fill="#10b981" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Validation traces attached</text>

  <line x1="960" y1="380" x2="960" y2="420" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

  <rect x="852" y="420" width="216" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="862" y="442" fill="#fbbf24" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Human Review Checkpoint</text>
  <text x="862" y="460" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Strict pause for review</text>
  <text x="862" y="478" fill="#cbd5e1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">GitHub PR Sticky 1-Click Diff</text>
  <text x="862" y="494" fill="#cbd5e1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">CLI: gdss apply sug_... </text>
  <text x="862" y="512" fill="#ef4444" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Never auto-merges without human</text>

  <!-- Footer Caption -->
  <text x="40" y="595" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">GDSS Architecture · Deterministic Conflict Partitioning eliminates O(N) sequential latency while preserving lossless context integrity.</text>
