  <text x="503" y="238" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">compose / keep_left</text>

  <line x1="620" y1="220" x2="648" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

  <rect x="648" y="188" width="115" height="65" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
