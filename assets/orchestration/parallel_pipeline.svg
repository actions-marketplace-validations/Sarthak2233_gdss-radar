  <!-- Background Canvas -->
  <rect x="0" y="0" width="1120" height="620" fill="url(#canvasGrad)" rx="16" />

  <!-- Title & Subtitle -->
  <text x="40" y="42" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="20">GDSS Intelligent Parallel Orchestration &amp; Local Sub-Loop Architecture</text>
  <text x="40" y="66" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13">Topological Conflict Partitioning · Concurrent LLM Drafting · In-Worker Syntax Self-Correction · Composite Sandbox Proof</text>

  <!-- ================= STAGE 1: TOPOLOGICAL PARTITIONING ================= -->
  <rect x="40" y="100" width="220" height="470" rx="12" fill="url(#cardGrad)" stroke="#1e3a8a" stroke-width="2" />
  <rect x="52" y="112" width="196" height="28" rx="6" fill="#1e3a8a" />
  <text x="62" y="131" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">1 · CONFLICT PARTITIONING</text>

  <rect x="52" y="155" width="196" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="62" y="177" fill="#38bdf8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Incoming Suggestions</text>
  <text x="62" y="195" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Ranked conflict pairs: S₁, S₂, ..., Sₙ</text>
  <text x="62" y="213" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">AST anchors &amp; pairwise Ω_ij</text>

  <rect x="52" y="245" width="196" height="95" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
  <text x="62" y="267" fill="#f59e0b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Cluster 1 (Coupled)</text>
  <text x="62" y="285" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">File: services/auth.py</text>
  <text x="62" y="303" fill="#cbd5e1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Includes: [login, verify_token]</text>
  <text x="62" y="321" fill="#10b981" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Unified file context preserved</text>

  <rect x="52" y="355" width="196" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="62" y="377" fill="#38bdf8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Cluster 2 (Disjoint)</text>
  <text x="62" y="395" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">File: services/billing.py</text>
  <text x="62" y="413" fill="#a855f7" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Independent execution</text>

  <rect x="52" y="445" width="196" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="62" y="467" fill="#38bdf8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Cluster 3 (Disjoint)</text>
  <text x="62" y="485" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">File: frontend/app.tsx</text>
  <text x="62" y="503" fill="#a855f7" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Independent execution</text>

